<script>
/* DIAG: tampilkan galat start di layar kalau app tidak jalan (hapus blok ini setelah masalahnya ketemu) */
(function () {
  var errs = [];
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) errs.push('GAGAL MUAT: ' + (t.src || t.href));
    else errs.push('ERROR: ' + e.message + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('PROMISE: ' + (r && r.message ? r.message : String(r))); });
  function show(extra) {
    var b = document.createElement('pre');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;margin:0;padding:10px 12px;background:#3a0a0a;color:#ffdede;font:11px/1.45 monospace;z-index:2147483647;white-space:pre-wrap;word-break:break-all';
    b.textContent = 'DIAG (screenshot layar ini)\n' + extra + '\n' + errs.join('\n') + '\nUA: ' + navigator.userAgent + '\nSW: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'aktif' : 'tidak');
    b.onclick = function () { b.remove(); };
    (document.body || document.documentElement).appendChild(b);
  }
  setTimeout(function () {
    if (document.querySelector('.menu-btn__ic--grid')) return;   // app sudah jalan: tidak menampilkan apa pun
    var s = document.querySelector('script[type=module][src]');
    if (!s) { show('Tag script app tidak ditemukan'); return; }
    fetch(s.src, { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { show('APP BELUM JALAN. ' + s.src.split('/').pop() + ' -> HTTP ' + r.status + ' ' + (r.headers.get('content-type') || '')); })
      .catch(function (x) { show('APP BELUM JALAN. fetch gagal: ' + x); });
  }, 5000);
})();
</script>

<style>
/* ikon speaker pengganti lampu on/off track: warna sama dengan tombol titik tiga (!important supaya menang atas gaya titik lama di styles.css & flat-ui.css) */
.trkcard__power{position:relative;display:grid!important;place-items:center;width:18px!important;height:18px!important;margin:0 2px!important;border-radius:6px!important;background:transparent!important;box-shadow:none!important;color:var(--text)!important;transition:transform .25s var(--ease-spring)}
.trkcard__power .spk{grid-area:1/1;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:none;transition:opacity .2s ease}
.trkcard__power .spk--off{opacity:0}
.trkcard__power[aria-checked="false"] .spk--on{opacity:0}
.trkcard__power[aria-checked="false"] .spk--off{opacity:1}
html[data-uistyle="flat"] .trkcard__power{color:var(--flat-text)!important}
/* teks "Stereo" di bawah nama track + huruf L / R di sudut bawah knob pan (tanpa menambah tinggi card: margin negatif, L/R menempel di sudut kotak knob) */
.trkcard__sub{margin-top:-3px;height:12px;line-height:12px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}
.trkcard-wrap[data-ins="Automation"] .trkcard__sub{display:none}
.trkcard__pan{position:relative}
.trkcard__pan::before,.trkcard__pan::after{position:absolute;bottom:-1px;font:500 8px/1 system-ui,sans-serif;color:var(--muted);pointer-events:none}
.trkcard__pan::before{content:"L";left:-3px}
.trkcard__pan::after{content:"R";right:-3px}
html[data-uistyle="flat"] .trkcard__sub,html[data-uistyle="flat"] .trkcard__pan::before,html[data-uistyle="flat"] .trkcard__pan::after{color:var(--flat-muted)}
/* tombol layar penuh + rotasi (landscape.ts) dipindah ke header panel channel mixer: sebaris dengan titik tiga, mentok kanan */
.tl-corner .landscape-btn{position:absolute!important;top:6px!important;left:auto!important;right:14px!important;z-index:2!important;width:36px!important;height:36px!important;border:0!important;border-radius:50%!important;background:#1f1f29!important;color:var(--text)!important;opacity:1!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}
.tl-corner .landscape-btn:hover{background:#2b2b37!important}
.tl-corner .landscape-btn svg{width:16px!important;height:16px!important}
.tracklist--collapsed .tl-corner .landscape-btn{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
html[data-uistyle="flat"] .tl-corner .landscape-btn{border:1px solid var(--flat-line)!important;border-radius:3px!important;background:var(--flat-ctrl)!important;color:var(--flat-text)!important}
html[data-uistyle="flat"] .tl-corner .landscape-btn:hover{background:var(--flat-ctrl-hover)!important}
/* menu "Tambahkan track": panel selebar halaman di TENGAH layar vertikal (tinggi menyesuaikan isi, tidak menutup seluruh layar); tiap instrumen satu kartu berisi teks saja, rata tengah (!important menimpa posisi inline dari JS) */
.add-menu{position:fixed!important;left:0!important;right:0!important;top:0!important;bottom:0!important;margin:auto 0!important;width:auto!important;height:max-content!important;max-height:calc(100vh - 96px);overflow-y:auto;z-index:470!important;box-sizing:border-box;display:flex!important;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:10px;padding:14px 14px!important;background:var(--panel)!important;border:0!important;border-top:1px solid rgba(255,255,255,.1)!important;border-bottom:1px solid rgba(255,255,255,.1)!important;border-radius:0!important;box-shadow:0 0 40px rgba(0,0,0,.45)!important;animation:addSheetIn .28s var(--ease-out) backwards!important}
.add-menu::before{display:none}
.add-menu::after{content:"Tambahkan track";order:-1;flex:0 0 100%;text-align:center;margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}
.add-menu .add-menu__item{display:flex!important;flex:1 1 140px;max-width:220px;align-items:center;justify-content:center;text-align:center;width:auto!important;height:auto!important;position:relative;min-height:68px;padding:12px!important;background:var(--card)!important;border:0!important;border-radius:14px!important;box-shadow:var(--bevel)!important;font-family:inherit;font-size:15px;font-weight:600;line-height:1.2;color:var(--text);animation:addCardIn .3s var(--ease-out) backwards!important;animation-delay:calc(var(--i,0)*40ms)!important}
.add-menu .add-menu__item:hover,.add-menu .add-menu__item:focus-visible{background:var(--panel2)!important;box-shadow:var(--bevel-hover)!important;transform:none!important}
.add-menu__item::before,.add-menu__item::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.add-menu__item::before{padding:1px;z-index:2;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.035) 32%,rgba(255,255,255,.01) 62%,rgba(255,255,255,.08));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.add-menu__item::after{background:radial-gradient(90% 130% at 0% 0%,rgba(255,255,255,.03),transparent 58%),linear-gradient(180deg,rgba(255,255,255,.012),rgba(255,255,255,0) 55%)}
.add-menu .add-menu__item:active{transform:scale(.97)!important}
html[data-uistyle="flat"] .add-menu{background:var(--flat-ap-panel)!important;border-top:1px solid var(--flat-ap-border)!important;border-bottom:1px solid var(--flat-ap-border)!important;box-shadow:none!important;color:var(--flat-ap-text)}
html[data-uistyle="flat"] .add-menu::after{color:var(--flat-ap-text);opacity:.65}
html[data-uistyle="flat"] .add-menu .add-menu__item{background:var(--flat-ap-raised)!important;border:1px solid var(--flat-ap-border)!important;border-radius:3px!important;color:var(--flat-ap-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.18)!important}
html[data-uistyle="flat"] .add-menu__item::before{display:none}
html[data-uistyle="flat"] .add-menu .add-menu__item:hover,html[data-uistyle="flat"] .add-menu .add-menu__item:focus-visible{background:var(--flat-ap-muted)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.2)!important}
body:has(.add-menu)::after{content:"";position:fixed;inset:0;z-index:465;background:rgba(0,0,0,.4);pointer-events:none;animation:addScrimIn .25s ease backwards}
@keyframes addSheetIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes addCardIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes addScrimIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.add-menu,.add-menu .add-menu__item,body:has(.add-menu)::after{animation:none!important}}
/* animasi idle ikon tombol menu: "Quarter Turn" - seluruh ikon (4 lingkaran logo) berputar 90 derajat per langkah dengan ease halus, lalu diam; 4 langkah = 1 putaran penuh (12 detik), lingkaran ungu berpindah sudut tiap langkah */
.menu-btn__ic--grid .mb-all{transform-box:view-box;transform-origin:50% 50%;animation:mbQt 12s infinite}
@keyframes mbQt{0%{transform:rotate(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}9%,25%{transform:rotate(90deg)}25%{animation-timing-function:cubic-bezier(.65,0,.35,1)}34%,50%{transform:rotate(180deg)}50%{animation-timing-function:cubic-bezier(.65,0,.35,1)}59%,75%{transform:rotate(270deg)}75%{animation-timing-function:cubic-bezier(.65,0,.35,1)}84%,100%{transform:rotate(360deg)}}
/* huruf M L V O di dalam tiap lingkaran berputar BALIK dengan sudut, durasi, dan easing yang sama persis (pusat putar = pusat lingkarannya sendiri), jadi huruf selalu tegak, tidak pernah terbalik */
.menu-btn__ic--grid .mb-up{transform-box:fill-box;transform-origin:50% 50%;animation:mbQtInv 12s infinite}
@keyframes mbQtInv{0%{transform:rotate(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}9%,25%{transform:rotate(-90deg)}25%{animation-timing-function:cubic-bezier(.65,0,.35,1)}34%,50%{transform:rotate(-180deg)}50%{animation-timing-function:cubic-bezier(.65,0,.35,1)}59%,75%{transform:rotate(-270deg)}75%{animation-timing-function:cubic-bezier(.65,0,.35,1)}84%,100%{transform:rotate(-360deg)}}
/* tema flat (latar bisa terang): lingkaran lavender diberi garis tipis supaya tetap terlihat */
html[data-uistyle="flat"] .menu-btn__ic--grid .mb-c{stroke:var(--flat-text,#777)}
.menu-btn.is-open .menu-btn__ic--grid *,body:has(.pr.is-open) .menu-btn__ic--grid *{animation:none!important}
@media (prefers-reduced-motion:reduce){.menu-btn__ic--grid .mb-all,.menu-btn__ic--grid .mb-up{animation:none!important}}
/* ikon tombol menu diperbesar (20px -> 30px); isi SVG & animasi ikut skala karena memakai viewBox, tombol 40px tetap */
.menu-btn .menu-btn__ic{width:30px;height:30px}
html[data-uistyle="flat"] .menu-btn .menu-btn__ic{width:26px;height:26px}
@media (prefers-reduced-motion:reduce){.trkcard__power,.trkcard__power .spk{transition:none!important}}
</style>
</head>

<div class="stage">
<div class="workspace">
  <!-- Daftar track -->

    <div class="tl-corner">
      <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-label="Tutup panel track" title="Tutup panel track"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <!-- Titik tiga: dropdown opsi playlist (View -> Automatic Scroll; ikon Lucide "ellipsis", ISC) -->
      <button class="panel-toggle more-toggle" id="playlistMoreToggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Opsi playlist" title="Opsi playlist"><svg class="ico-ln" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    </div>
    <section class="headers" aria-label="Daftar Track">
      <div class="headers-list">
        <div class="trkcard-wrap" data-track="1">
          <div class="trkcard trkcard--on trkcard--top">
            <div class="trkcard__edge"></div>
            <div class="trkcard-body">
              <button title="Tampilkan instrumen" class="trkcard__lead bare-btn">
                <span class="trkcard__inst"><span class="ico"><svg class="ico-ln" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M10 13v4"/><path d="M14 13v4"/><path d="M18 13v4"/><path d="M2 13h20"/><path d="M22 11.5A3.5 3.5 0 0 0 18.5 8a3.52 3.52 0 0 1-3.173-2A7 7 0 0 0 2 9v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2z"/><path d="M6 13v4"/></svg></span></span>
              </button>
              <div class="trkcard__rows">
                <div class="trkcard__head">
                  <div class="trkcard__title">
                    <button title="Grand Piano" class="trkcard__title-btn flat-btn"><span id="track-name-1">Grand Piano</span></button>
                  </div>
                  <button type="button" role="switch" aria-checked="true" aria-label="Track nyala / mati" title="Track nyala / mati" class="trkcard__power"><svg class="spk spk--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.25 9H6.5l3.9-3.3a.6.6 0 0 1 .98.46v11.68a.6.6 0 0 1-.98.46L6.5 15H4.25a.75.75 0 0 1-.75-.75v-4.5A.75.75 0 0 1 4.25 9z"/><path d="M14.5 9.5a3.6 3.6 0 0 1 0 5"/><path d="M17.2 7a7.2 7.2 0 0 1 0 10"/></svg><svg class="spk spk--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g mask="url(#spk-gap)"><path d="M4.25 9H6.5l3.9-3.3a.6.6 0 0 1 .98.46v11.68a.6.6 0 0 1-.98.46L6.5 15H4.25a.75.75 0 0 1-.75-.75v-4.5A.75.75 0 0 1 4.25 9z"/><path d="M14.5 9.5a3.6 3.6 0 0 1 0 5"/><path d="M17.2 7a7.2 7.2 0 0 1 0 10"/></g><path d="M4 4l16 16"/></svg></button>
                  <button title="Opsi track…" aria-haspopup="menu" aria-expanded="false" class="ico-btn trkcard__menu"><span class="ico" style="width:16px;height:16px"><svg class="ico-ln" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span></button>
                </div>
                <div class="trkcard__sub">Stereo</div>
                <div class="trkcard__ctrl">
                  <div class="trkcard__ctrl-in">

            </div>

<!-- Panel efek: menempel di sisi kanan layar, dibuka / ditutup lewat tab panah di tepi kiri panel (menempel di tepi kanan layar saat tertutup, tinggi layar bagian tengah) -->
<aside class="fx" id="fxPanel" aria-label="Panel efek">
  <button class="fx__toggle" id="fxToggle" type="button" aria-expanded="true" aria-controls="fxBody" aria-label="Tutup panel efek" title="Tutup panel efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.2C8 4.6 6.8 5.3 6.8 6.5V17.5C6.8 18.7 8 19.4 9 18.8L17 13.2C18 12.5 18 11.5 17 10.8Z"/></svg></button>
  <div class="fx__clip">
    <div class="fx__panel" id="fxBody">
      <header class="fx__head fx__item" style="--i:0"><h2 class="fx__title">Effects</h2></header>
      <div class="fx__pages fx__item" style="--i:1" id="fxPages" data-page="plugin" role="tablist" aria-label="Halaman panel efek">
        <button type="button" role="tab" class="fx__page" id="fxPagePlugin" data-page="plugin" aria-selected="true" aria-controls="fxList">Plugin</button>
        <button type="button" role="tab" class="fx__page" id="fxPageEffect" data-page="effect" aria-selected="false" aria-controls="fxList" tabindex="-1">Effect</button>
      </div>
      <div class="fx__body">
        <div class="fx__top fx__item" style="--i:2">
          <button type="button" class="fx__add" id="fxAdd" aria-haspopup="menu" aria-expanded="false" aria-label="Tambah efek" title="Tambah efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="fx__list" id="fxList"></div>
      </div>
    </div>
  </div>
</aside>
</div>

<footer class="transportbar" id="dockBar">
<div class="dock-clip" id="dockClip">
<div class="tp-dock" id="dockCard"><div role="group" aria-label="Kontrol transport" class="tp"><div class="tp__side tp__side--l"><button type="button" class="hist-btn more-btn" id="btnPrMenu" aria-haspopup="true" aria-expanded="false" aria-controls="pianoRoll" aria-label="Menu piano roll" title="Menu piano roll"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button><button type="button" class="hist-btn pitch-btn" id="btnPitch" aria-label="Pitch project" title="Pitch project"></button><button type="button" class="hist-btn more-btn" id="btnMore" aria-haspopup="menu" aria-expanded="false" aria-label="Opsi transport" title="Opsi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button><button type="button" class="hist-btn metro-btn" id="btnMetro" aria-label="Metronome dan BPM" title="Metronome &amp; BPM">M</button></div><div class="tp__mid"><button data-testid="Mundur [Arrow left]" aria-label="Mundur" title="Mundur (←)" class="rewind tp__btn bs-md txt-lg bare-btn"><span class="ico ico--svg ic-rewind"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#rewind-icon"></use></svg></span></button><button data-testid="Putar/jeda [Space]" aria-label="Putar" title="Putar/jeda (Space)" class="play tp__btn bs-md txt-lg inv-on bare-btn"><span class="ico ico--svg ic-play"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#play-icon"></use></svg></span></button><button data-testid="Maju cepat [Arrow right]" aria-label="Maju cepat" title="Maju cepat (→)" class="forward tp__btn bs-md txt-lg bare-btn"><span class="ico ico--svg ic-forward"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#forward-icon"></use></svg></span></button></div><div class="tp__side tp__side--r"><button type="button" class="hist-btn hist-ico" id="btnUndo" aria-label="Urungkan (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button type="button" class="hist-btn hist-ico" id="btnRedo" aria-label="Ulangi (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button></div></div></div>
</div>
<button class="kbd-toggle tp__btn bare-btn" id="kbdToggle" type="button" aria-controls="dockClip" aria-expanded="true" aria-label="Tutup panel bawah" title="Tutup panel bawah"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>

<!-- Keyboard virtual: tingginya diatur dengan menyeret card transport ke atas / bawah; panah di kanan card menutup seluruh panel bawah -->
<section class="kbd" id="kbd" aria-label="Keyboard virtual" aria-hidden="true" inert>
  <div class="kbd__inner">
    <div class="kbd__bar">
      <span class="kbd__title" id="kbdTitle"></span>

      </div>
    </div>
    <div class="ivk" id="kbdKeys"><div class="ivk__scroll"><div class="ivk__keys"></div></div></div>
  </div>
</section>


<script type="module" src="/src/main.ts"></script>
<script type="module">
// pindahkan tombol layar penuh / rotasi (dibuat landscape.ts, awalnya di <body>) ke header panel channel mixer
(() => {
  const place = () => { const b = document.querySelector('body > .landscape-btn'), c = document.querySelector('.tl-corner'); if (b && c) { c.appendChild(b); return true; } return false; };
  if (place()) return;
  const mo = new MutationObserver(() => { if (place()) mo.disconnect(); });
  mo.observe(document.body, { childList: true });
  setTimeout(() => mo.disconnect(), 5000);
})();
</script>
<script type="module">
// Audio clip: setelah track dibuat, card "Upload audio" (audio-upload-card.ts) tidak perlu diketuk lagi: pemilih file langsung dibuka dari ketukan yang sama.
// Kalau browser tidak mengizinkan (tidak ada aktivasi pengguna), card tetap tampil seperti biasa.
(() => {
  const handle = (card) => {
    if (!navigator.userActivation || !navigator.userActivation.isActive) return;
    const btn = card.querySelector('.upl-btn'), input = card.querySelector('.upl-input');
    if (!btn || !input) return;
    card.style.opacity = '0'; card.style.pointerEvents = 'none';
    const dismiss = () => { if (card.isConnected && !(input.files && input.files.length)) card.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); };
    input.addEventListener('cancel', dismiss);
    window.addEventListener('focus', () => setTimeout(dismiss, 700), { once: true });   // cadangan untuk browser tanpa event cancel
    btn.click();
  };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.classList && n.classList.contains('upl-card')) handle(n); }))).observe(document.body, { childList: true });
})();
</script>
<script type="module">
// ikon tombol menu kanan atas (dibuat menu-panel.ts): 4 lingkaran OUTLINE (tanpa huruf) dalam satu grup yang berputar "Quarter Turn" (CSS di <style> atas).
// Tiga lingkaran lavender + satu lingkaran ungu (berpindah sudut tiap langkah). Radius 3.6 + garis 1.2 = tepi luar 4.2, sama seperti lingkaran isi sebelumnya.
(() => {
  const LAV = '#EDEBFF', PUR = '#A77BFF';
  const ICON =
    '<g class="mb-all" fill="none" stroke-width="1.2">' +
      '<circle class="mb-c" cx="7.5" cy="7.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle class="mb-c" cx="16.5" cy="7.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle class="mb-c" cx="7.5" cy="16.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle cx="16.5" cy="16.5" r="3.6" stroke="' + PUR + '"/>' +
    '</g>';
  const swap = () => {
    const ic = document.querySelector('.menu-btn__ic--grid'); if (!ic) return false;
    ic.innerHTML = ICON; return true;
  };
  if (swap()) return;
  const mo = new MutationObserver(() => { if (swap()) mo.disconnect(); });
  mo.observe(document.body, { childList: true, subtree: true });
  setTimeout(() => mo.disconnect(), 5000);
})();
</script>

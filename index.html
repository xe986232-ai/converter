<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Melvox</title>
<meta name="theme-color" content="#2A2D34">
<meta name="description" content="DAW di browser: playlist canvas.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Melvox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
  <div id="app">
    <header class="top">
      <strong class="brand">Melvox</strong>
      <span class="spacer"></span>
      <button id="btn-new">Baru</button>
      <button id="btn-demo">Demo</button>
      <button id="btn-export">Ekspor</button>
      <button id="btn-import">Impor</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden>
    </header>
    <main class="main">
      <aside id="bw" hidden></aside>
      <div class="center">
        <div class="stage">
          <div class="stage-main">
            <section class="pl-host" id="pl-host"></section>
            <section class="pr-panel" id="pr-panel" hidden>
              <div class="pr-head">
                <span class="pr-dot" id="pr-dot"></span>
                <span class="pr-title" id="pr-title">Piano roll</span>
                <span class="spacer"></span>
                <button id="pr-close">Tutup</button>
              </div>
              <div class="pr-host" id="pr-host"></div>
            </section>
          </div>
          <!-- Panel FX LAMA: menempel di sisi kanan, buka/tutup lewat tab panah di tepi kirinya -->
          <aside class="fx" id="fxPanel" aria-label="Panel efek">
            <button class="fx__toggle" id="fxToggle" type="button" aria-expanded="true" aria-controls="fxBody" aria-label="Tutup panel efek" title="Tutup panel efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.2C8 4.6 6.8 5.3 6.8 6.5V17.5C6.8 18.7 8 19.4 9 18.8L17 13.2C18 12.5 18 11.5 17 10.8Z"/></svg></button>
            <div class="fx__clip">
              <div class="fx__panel" id="fxBody">
                <header class="fx__head fx__item" style="--i:0"><h2 class="fx__title">Effects</h2></header>
                <div class="fx__pages fx__item" style="--i:1" id="fxPages" data-page="plugin" role="tablist" aria-label="Halaman panel efek">
                  <button type="button" role="tab" class="fx__page" id="fxPagePlugin" data-page="plugin" aria-selected="true" aria-controls="fxList">Plugin</button>
                  <button type="button" role="tab" class="fx__page" id="fxPageEffect" data-page="effect" aria-selected="false" aria-controls="fxList" tabindex="-1">Effect</button>
                </div>
                <div class="fx__body">
                  <div class="fx__top fx__item" style="--i:2">
                    <button type="button" class="fx__add" id="fxAdd" aria-haspopup="menu" aria-expanded="false" aria-label="Tambah efek" title="Tambah efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                  </div>
                  <div class="fx__list" id="fxList"></div>
                </div>
              </div>
            </div>
          </aside>
        </div>
        <section class="fx-host" id="fx-host" hidden></section>
        <div id="dock-host"></div>
      </div>
    </main>
  </div>
  <button id="btn-settings" aria-label="Pengaturan" title="Pengaturan" aria-haspopup="dialog" aria-controls="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
  <button id="btn-browser" aria-label="Browser file" title="Browser file"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/><path d="M9.5 4.5v15"/><path d="M5.6 8.5h1.8M5.6 11.5h1.8M5.6 14.5h1.8"/></svg></button>
  <div id="settings" hidden>
    <div class="set-card" role="dialog" aria-modal="true" aria-labelledby="set-title" tabindex="-1">
      <div class="set-head" id="set-title">Pengaturan</div>
      <div class="set-sub">Project</div>
      <div class="set-row"><span>Tempo (BPM)</span>
        <span class="set-step">
          <button id="bpm-dec" aria-label="Kurangi BPM">&minus;</button>
          <input id="set-bpm" type="number" inputmode="numeric" min="40" max="240" step="1" value="120" aria-label="BPM">
          <button id="bpm-inc" aria-label="Tambah BPM">+</button>
        </span>
      </div>
      <div class="set-row"><span>Metronom</span>
        <span class="seg" id="metro-seg"><button data-metro="0">Mati</button><button data-metro="1">Nyala</button></span>
      </div>
      <div class="set-sub">Playlist Setting</div>
      <div class="set-row"><span>Random Color Track</span>
        <button id="btn-randcolor" class="set-wide">Acak warna</button>
      </div>
      <div class="set-row set-pair">
        <label class="set-half"><span>Atas</span><input id="grad-top" class="set-color" type="color" value="#1E88E5" aria-label="Warna track paling atas"></label>
        <label class="set-half"><span>Bawah</span><input id="grad-bot" class="set-color" type="color" value="#00A86B" aria-label="Warna track paling bawah"></label>
      </div>
      <div class="set-row"><span>Gradient Color</span>
        <button id="btn-gradient" class="set-wide">Terapkan</button>
      </div>
      <div class="set-sub">Aplikasi</div>
      <div class="set-row"><span>Tema</span>
        <span class="seg"><button data-theme="light">Terang</button><button data-theme="dark">Gelap</button></span>
      </div>
      <div class="set-row"><span>Layar penuh</span>
        <span class="seg" id="fs-seg"><button data-fs="0">Mati</button><button data-fs="1">Nyala</button></span>
      </div>
      <div class="set-row" id="ls-row"><span>Landscape</span>
        <span class="seg" id="ls-seg"><button data-ls="0">Mati</button><button data-ls="1">Nyala</button></span>
      </div>
      <div class="set-row" id="install-row" hidden><span>Aplikasi</span>
        <button id="btn-install" class="set-wide">Pasang</button>
      </div>
    </div>
  </div>
  <input id="file-restore" type="file" accept=".zip,application/zip" hidden>
  <div id="toast" hidden></div>
  <script type="module" src="/src/pl/main.ts"></script>
</body>
</html>

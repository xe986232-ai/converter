<script>
/* DIAG: tampilkan galat start di layar kalau app tidak jalan (hapus blok ini setelah masalahnya ketemu) */
(function () {
  var errs = [];
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) errs.push('GAGAL MUAT: ' + (t.src || t.href));
    else errs.push('ERROR: ' + e.message + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('PROMISE: ' + (r && r.message ? r.message : String(r))); });
  function show(extra) {
    var b = document.createElement('pre');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;margin:0;padding:10px 12px;background:#3a0a0a;color:#ffdede;font:11px/1.45 monospace;z-index:2147483647;white-space:pre-wrap;word-break:break-all';
    b.textContent = 'DIAG (screenshot layar ini)\n' + extra + '\n' + errs.join('\n') + '\nUA: ' + navigator.userAgent + '\nSW: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'aktif' : 'tidak');
    b.onclick = function () { b.remove(); };
    (document.body || document.documentElement).appendChild(b);
  }
  setTimeout(function () {
    if (document.querySelector('.menu-btn__ic--grid')) return;   // app sudah jalan: tidak menampilkan apa pun
    var s = document.querySelector('script[type=module][src]');
    if (!s) { show('Tag script app tidak ditemukan'); return; }
    fetch(s.src, { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { show('APP BELUM JALAN. ' + s.src.split('/').pop() + ' -> HTTP ' + r.status + ' ' + (r.headers.get('content-type') || '')); })
      .catch(function (x) { show('APP BELUM JALAN. fetch gagal: ' + x); });
  }, 5000);
})();
</script>

<script type="module">
// pindahkan tombol layar penuh / rotasi (dibuat landscape.ts, awalnya di <body>) ke header panel channel mixer
(() => {
  const place = () => { const b = document.querySelector('body > .landscape-btn'), c = document.querySelector('.tl-corner'); if (b && c) { c.appendChild(b); return true; } return false; };
  if (place()) return;
  const mo = new MutationObserver(() => { if (place()) mo.disconnect(); });
  mo.observe(document.body, { childList: true });
  setTimeout(() => mo.disconnect(), 5000);
})();
</script>
<script type="module">
// Audio clip: setelah track dibuat, card "Upload audio" (audio-upload-card.ts) tidak perlu diketuk lagi: pemilih file langsung dibuka dari ketukan yang sama.
// Kalau browser tidak mengizinkan (tidak ada aktivasi pengguna), card tetap tampil seperti biasa.
(() => {
  const handle = (card) => {
    if (!navigator.userActivation || !navigator.userActivation.isActive) return;
    const btn = card.querySelector('.upl-btn'), input = card.querySelector('.upl-input');
    if (!btn || !input) return;
    card.style.opacity = '0'; card.style.pointerEvents = 'none';
    const dismiss = () => { if (card.isConnected && !(input.files && input.files.length)) card.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); };
    input.addEventListener('cancel', dismiss);
    window.addEventListener('focus', () => setTimeout(dismiss, 700), { once: true });   // cadangan untuk browser tanpa event cancel
    btn.click();
  };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.classList && n.classList.contains('upl-card')) handle(n); }))).observe(document.body, { childList: true });
})();
</script>
<script type="module">
// ikon tombol menu kanan atas (dibuat menu-panel.ts): 4 lingkaran OUTLINE (tanpa huruf) dalam satu grup yang berputar "Quarter Turn" (CSS di <style> atas).
// Tiga lingkaran lavender + satu lingkaran ungu (berpindah sudut tiap langkah). Radius 3.6 + garis 1.2 = tepi luar 4.2, sama seperti lingkaran isi sebelumnya.
(() => {
  const LAV = '#EDEBFF', PUR = '#A77BFF';
  const ICON =
    '<g class="mb-all" fill="none" stroke-width="1.2">' +
      '<circle class="mb-c" cx="7.5" cy="7.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle class="mb-c" cx="16.5" cy="7.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle class="mb-c" cx="7.5" cy="16.5" r="3.6" stroke="' + LAV + '"/>' +
      '<circle cx="16.5" cy="16.5" r="3.6" stroke="' + PUR + '"/>' +
    '</g>';
  const swap = () => {
    const ic = document.querySelector('.menu-btn__ic--grid'); if (!ic) return false;
    ic.innerHTML = ICON; return true;
  };
  if (swap()) return;
  const mo = new MutationObserver(() => { if (swap()) mo.disconnect(); });
  mo.observe(document.body, { childList: true, subtree: true });
  setTimeout(() => mo.disconnect(), 5000);
})();
</script>
</body>
</html>
